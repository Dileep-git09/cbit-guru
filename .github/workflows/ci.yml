name: CI

# Runs on every push to main and every pull request — the thing this repo
# didn't have until now: proof that "it works" is checked automatically on
# every change, not just when someone remembers to run the smoke test by
# hand before merging. Needs zero secrets: the backend job's smoke test
# fakes the Gemini/Cohere calls and runs against an in-memory Qdrant (see
# scripts/smoke_test.py), so there's nothing here to leak even if this
# workflow's logs were ever public.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Smoke test (offline, zero API cost — fake embeddings/LLM, in-memory Qdrant)
        run: python -m scripts.smoke_test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
