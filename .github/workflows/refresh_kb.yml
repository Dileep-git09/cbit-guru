name: Refresh Knowledge Base

# Implements docs/FUTURE_SCOPE_AUTO_REFRESH.md: re-scrapes cbit.ac.in on a
# schedule and re-ingests only what's actually new, changed, or removed
# since last time (backend/scripts/refresh_knowledge_base.py) — the
# knowledge base stays current without an admin manually re-running things.
#
# Runs on its own schedule, separate from ci.yml on purpose — a slow or
# failing scrape here can never affect the live chat endpoint students are
# using; the two are independent by design (see app/main.py's liveness vs.
# readiness split for the same principle applied elsewhere in this repo).
on:
  schedule:
    - cron: "0 3 * * 0"  # Sunday 03:00 UTC — weekly, low-traffic window
  workflow_dispatch:  # manual "Run workflow" button for an on-demand refresh

permissions:
  contents: write  # needed to commit the updated crawl_state.json back

jobs:
  refresh:
    name: Scrape, diff, and re-ingest what changed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's Chromium (JS-rendered page fallback)
        run: python -m playwright install --with-deps chromium

      - name: Scrape cbit.ac.in
        run: python -m scraper.crawl

      - name: Diff against last run and re-ingest what changed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: python -m scripts.refresh_knowledge_base | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit updated crawl_state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crawl_state.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Auto-refresh: sync crawl_state.json ($(date -u +%Y-%m-%d))"
          git push
