# Render "Blueprint" — lets Render provision the backend service straight
# from this repo (New + -> Blueprint, point it at this repo) instead of
# clicking through the dashboard by hand. Secrets are intentionally NOT
# listed here (sync: false) — Render prompts for them once at setup and
# stores them encrypted; they never touch this file or git history.
# Full walkthrough: docs/DEPLOYMENT.md
services:
  - type: web
    name: cbit-guru-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: cbit_guru_rag
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false # set after the frontend is deployed, e.g. https://cbit-guru.vercel.app
      - key: LOG_FORMAT
        value: json # structured logs are what Render's log viewer actually benefits from
      - key: CACHE_ENABLED
        value: "true"
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "30"
